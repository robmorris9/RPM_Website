<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robert Morris | Analytics, Automation &amp; Banking</title>
  <meta name="description" content="{{SUMMARY}}">
  <link rel="canonical" href="https://robmorris.me/">
  <meta name="theme-color" content="#252729">
  <meta name="color-scheme" content="dark">
  <meta property="og:type" content="profile">
  <meta property="og:title" content="Robert Morris | Analytics, Automation &amp; Banking">
  <meta property="og:description" content="{{SUMMARY}}">
  <meta property="og:url" content="https://robmorris.me/">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23252729'/%3E%3Ctext x='16' y='25' font-family='sans-serif' font-size='25' fill='%23a7c3b0' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E">
  <link rel="preload" href="assets/fonts/IBMPlexSans-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="assets/styles.css">
  <script type="application/ld+json">{{JSON_LD}}</script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div class="page">
    <header class="hero">
      <h1>{{NAME}}</h1>
      <p class="headline">{{HEADLINE}}</p>
      <p class="summary">{{SUMMARY}}</p>
      {{CONTACT}}
    </header>
    <main id="main-content" tabindex="-1">
      <section class="section" id="experience" aria-labelledby="experience-heading">
        <h2 id="experience-heading">Experience</h2>
        <div class="section-body">{{EXPERIENCE}}</div>
      </section>
      <section class="section" id="capabilities" aria-labelledby="capabilities-heading">
        <h2 id="capabilities-heading">Capabilities</h2>
        <div class="section-body capability-grid">{{CAPABILITIES}}</div>
      </section>
      <section class="section" id="education" aria-labelledby="education-heading">
        <h2 id="education-heading">Education &amp;<br class="desktop-break"> leadership</h2>
        <div class="section-body education-list">{{EDUCATION}}{{LEADERSHIP}}</div>
      </section>
    </main>
    <footer class="section contact" id="contact" aria-labelledby="contact-heading">
      <h2 id="contact-heading">Let’s connect.</h2>
      <div class="section-body">{{CONTACT}}</div>
    </footer>
  </div>
</body>
</html>
